name: D7 LIVE Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: D7-LIVE/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: UI install
        working-directory: D7-LIVE
        run: npm ci
      - name: UI build
        working-directory: D7-LIVE
        run: npm run build
      - name: Rust tests
        working-directory: D7-LIVE
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        working-directory: D7-LIVE
        run: npm ci
      - name: Build application
        working-directory: D7-LIVE
        run: npm run tauri build
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            D7-LIVE/src-tauri/target/release/bundle/**/*.msi
            D7-LIVE/src-tauri/target/release/bundle/**/*.exe
