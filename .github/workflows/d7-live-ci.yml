name: D7 LIVE Windows CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'D7-LIVE/**'
      - '.github/workflows/d7-live-ci.yml'

permissions:
  contents: read

concurrency:
  group: d7-live-windows-ci
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: D7-LIVE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build React frontend
        run: npm run build

      - name: Run Rust core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build D7 LIVE NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Verify Windows bundle exists
        shell: powershell
        run: |
          $bundle = Get-ChildItem 'src-tauri\target\release\bundle\nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bundle) { throw 'D7 LIVE NSIS installer was not produced.' }
          Write-Host ('Installer: ' + $bundle.FullName)
          Write-Host ('Bytes: ' + $bundle.Length)

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: D7-LIVE-Windows-${{ github.sha }}
          path: D7-LIVE/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
