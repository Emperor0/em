name: Build D7 BLACKCORE v2.2 Frame Lab

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d7-blackcore-v220-framelab.yml'
      - 'd7-gaming-engine/v220/presentmon-core.ps1'
      - 'd7-gaming-engine/intelligence/tool-catalog.json'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose BLACKCORE v2.2 source
        shell: powershell
        run: |
          $base=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\v213\D7_BLACKCORE.ps1'
          $mod=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\v220\presentmon-core.ps1'
          $out=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\v220\D7_BLACKCORE.ps1'
          $raw=Get-Content $base -Raw -Encoding UTF8
          $module=Get-Content $mod -Raw -Encoding UTF8
          $raw=$raw.Replace("`$Version='2.1.3'","`$Version='2.2.0'")
          $raw=$raw.Replace("`$form.Text='D7 BLACKCORE v2.1.3'","`$form.Text='D7 BLACKCORE v2.2.0'")
          $raw=$raw.Replace('BLACKSCAN -> PLAN -> APPLY -> MEASURE -> LEARN -> ROLLBACK','BLACKSCAN -> FRAME LAB -> A/B -> TUNE -> VERIFY -> ROLLBACK')

          $m=[regex]::Match($raw,'(?m)^LoadGames\r?$')
          if(-not $m.Success){throw 'LoadGames insertion marker missing'}
          $raw=$raw.Substring(0,$m.Index)+$module+"`r`n`r`n"+$raw.Substring($m.Index)

          [IO.File]::WriteAllText($out,$raw,(New-Object Text.UTF8Encoding($true)))
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($out,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Host ('PARSER: '+$_.Message+' line '+$_.Extent.StartLineNumber)};throw ('Parser errors: '+$errors.Count)}
          foreach($bad in @('return$false','return$true','return$null','return[','return(',';finally','; finally')){if($raw.Contains($bad)){throw ('Runtime-dangerous token remains: '+$bad)}}
          foreach($required in @('function Ensure-PresentMon','function Invoke-PresentMonCapture','function Run-MeasurementBaseline','D7.MEASUREMENT.v2','D7 VERDICT')){if(-not $raw.Contains($required)){throw ('Required v2.2 feature missing: '+$required)}}
          $badCommands=@($ast.FindAll({param($n) if($n -is [System.Management.Automation.Language.CommandAst]){$c=$n.GetCommandName();return [bool]($c -eq 'finally' -or $c -match '^\.[A-Za-z_][A-Za-z0-9_]*$')}return $false},$true))
          if($badCommands.Count -gt 0){$badCommands|ForEach-Object{Write-Host ('BAD COMMAND AST: '+$_.Extent.Text)};throw ('Suspicious command AST nodes: '+$badCommands.Count)}
          "D7_SRC=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate official PresentMon asset and CLI contract
        shell: powershell
        run: |
          $cat=Get-Content (Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\intelligence\tool-catalog.json') -Raw|ConvertFrom-Json
          $pm=@($cat.tools|Where-Object id -eq 'presentmon')|Select-Object -First 1
          if(-not $pm){throw 'PresentMon missing from tool catalog'}
          $tmp=Join-Path $env:RUNNER_TEMP 'PresentMon.exe'
          Invoke-WebRequest -Uri $pm.downloadUrl -OutFile $tmp -UseBasicParsing
          $hash=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne ([string]$pm.sha256).ToLowerInvariant()){throw ('PresentMon hash mismatch: '+$hash)}
          $hout=Join-Path $env:RUNNER_TEMP 'presentmon-help-out.txt'
          $herr=Join-Path $env:RUNNER_TEMP 'presentmon-help-err.txt'
          $proc=Start-Process -FilePath $tmp -ArgumentList '--help' -RedirectStandardOutput $hout -RedirectStandardError $herr -Wait -PassThru
          $help=''
          if(Test-Path $hout){$help+=(Get-Content $hout -Raw -ErrorAction SilentlyContinue)}
          if(Test-Path $herr){$help+=(Get-Content $herr -Raw -ErrorAction SilentlyContinue)}
          foreach($flag in @('--process_id','--output_file','--timed','--terminate_after_timed','--v2_metrics','--session_name')){if($help -notmatch [regex]::Escape($flag)){throw ('PresentMon CLI flag missing: '+$flag)}}
          Write-Host ('PresentMon '+$pm.version+' verified SHA256 '+$hash+' helpExit='+$proc.ExitCode)

      - name: Install PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force

      - name: Build D7 BLACKCORE v2.2.0
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'D7Blackcore220';New-Item $out -ItemType Directory -Force|Out-Null
          $iconPath=Join-Path $env:RUNNER_TEMP 'D7.ico';$oldPkg=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable\D7_BLACKCORE_v2.1.3.zip'
          if(Test-Path $oldPkg){$tmp=Join-Path $env:RUNNER_TEMP 'Old220';Expand-Archive $oldPkg $tmp -Force;$old=Get-ChildItem $tmp -Recurse -Filter D7_Gaming_Engine.exe|Select-Object -First 1;if($old){Add-Type -AssemblyName System.Drawing;$ic=[Drawing.Icon]::ExtractAssociatedIcon($old.FullName);$st=[IO.File]::Create($iconPath);try{$ic.Save($st)}finally{$st.Dispose();$ic.Dispose()}}}
          $a=@{inputFile=$env:D7_SRC;outputFile=(Join-Path $out 'D7_Gaming_Engine.exe');x64=$true;STA=$true;noConsole=$true;requireAdmin=$true;title='D7 BLACKCORE';product='D7 BLACKCORE Gaming System Orchestrator';company='D7';version='2.2.0.0'};if(Test-Path $iconPath){$a.iconFile=$iconPath};Invoke-ps2exe @a
          Set-Content (Join-Path $out 'version.txt') '2.2.0' -Encoding ASCII
          Set-Content (Join-Path $out 'README_FRAME_LAB.txt') @'
          D7 BLACKCORE v2.2.0 - FRAME LAB
          - Automatically acquires the official PresentMon console binary from GameTechDev when measurement needs it.
          - Verifies the release SHA256 against D7's online tool catalog before execution.
          - 3-second measurement delay + 30-second gameplay capture.
          - PresentMon v2 metrics, dropped-frame exclusion, same-game A/B comparison.
          - KEEP / ROLLBACK / INCONCLUSIVE measurement verdict.
          - No CPU voltage, RAM timings, GPU OC, MSI mode, affinity or network offload changes are applied by this release.
          '@ -Encoding UTF8
          "D7_OUT=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package and publish stable
        shell: powershell
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'D7_BLACKCORE_v2.2.0.zip';Compress-Archive -Path (Join-Path $env:D7_OUT '*') -DestinationPath $zip -Force
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$stable=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable';Copy-Item $zip (Join-Path $stable 'D7_BLACKCORE_v2.2.0.zip') -Force
          $m=[ordered]@{product='D7 BLACKCORE';channel='stable';version='2.2.0';minimumWindowsBuild=19045;updateMode='online-only';packageUrl='https://raw.githubusercontent.com/Emperor0/em/main/d7-gaming-engine/stable/D7_BLACKCORE_v2.2.0.zip';sha256=$hash;changelogAr='FRAME LAB: automatic verified PresentMon acquisition, 30-second real capture, v2 metrics, same-game A/B comparison, and KEEP/ROLLBACK/INCONCLUSIVE verdict.';publishedUtc=(Get-Date).ToUniversalTime().ToString('o')}
          [IO.File]::WriteAllText((Join-Path $stable 'latest.json'),($m|ConvertTo-Json -Depth 5),(New-Object Text.UTF8Encoding($false)))
          git config user.name 'D7 Release Bot';git config user.email 'd7-release-bot@users.noreply.github.com'
          git add d7-gaming-engine/v220/D7_BLACKCORE.ps1 d7-gaming-engine/stable/D7_BLACKCORE_v2.2.0.zip d7-gaming-engine/stable/latest.json
          git commit -m 'Publish D7 BLACKCORE v2.2.0 Frame Lab'
          git pull --rebase origin main
          git push
          "D7_ZIP=$zip"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: D7-BLACKCORE-v2.2.0-Windows
          path: ${{ env.D7_ZIP }}
          retention-days: 30
