name: D7 BLACKCORE Next Dev CI

on:
  workflow_dispatch:
  push:
    branches:
      - blackcore-next
    paths:
      - 'd7-blackcore-next/**'
      - '.github/workflows/d7-blackcore-next-dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'd7-blackcore-next/**'
      - '.github/workflows/d7-blackcore-next-dev.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        working-directory: d7-blackcore-next
        run: dotnet restore D7.Blackcore.slnx

      - name: Build Release
        working-directory: d7-blackcore-next
        run: dotnet build D7.Blackcore.slnx -c Release --no-restore

      - name: Unit tests
        working-directory: d7-blackcore-next
        run: dotnet test tests/D7.UnitTests/D7.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Publish self-contained development artifact
        working-directory: d7-blackcore-next
        run: dotnet publish src/D7.App/D7.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/app --no-build

      - name: Assert stable was not modified by this workflow
        shell: pwsh
        run: |
          if (git status --porcelain -- d7-gaming-engine/stable D7-BLACKCORE/releases) {
            $changed = git status --porcelain -- d7-gaming-engine/stable D7-BLACKCORE/releases
            if ($changed) { throw "Development CI modified a production stable path: $changed" }
          }

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: D7-BLACKCORE-Next-dev-${{ github.sha }}
          path: d7-blackcore-next/artifacts/app
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D7-BLACKCORE-Next-tests-${{ github.sha }}
          path: d7-blackcore-next/tests/**/TestResults/**
          if-no-files-found: ignore
          retention-days: 7
