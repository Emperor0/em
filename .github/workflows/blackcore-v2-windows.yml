name: BLACKCORE 2.0 Windows Native
on:
  push:
    branches: [blackcore-2.0]
    paths:
      - 'D7-BLACKCORE/v2/apps/desktop/**'
      - '.github/workflows/blackcore-v2-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: D7-BLACKCORE/v2/apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend typecheck and build
        run: npm run build
      - name: Native Rust mission/runtime tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release
      - name: Build Tauri Windows installer
        run: npm run tauri:build
      - name: Verify native outputs
        shell: pwsh
        run: |
          $exe=Get-ChildItem 'src-tauri\target\release\d7-blackcore.exe' -ErrorAction Stop
          $installer=Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' -ErrorAction Stop|Select-Object -First 1
          Write-Host "Native EXE: $($exe.FullName) $($exe.Length) bytes"
          Write-Host "Installer: $($installer.FullName) $($installer.Length) bytes"
          if($exe.Length -lt 1000000){throw 'Native executable unexpectedly small'}
          if($installer.Length -lt 1000000){throw 'Installer unexpectedly small'}
      - uses: actions/upload-artifact@v4
        with:
          name: D7-BLACKCORE-2.0-dev.7-Windows
          path: |
            D7-BLACKCORE/v2/apps/desktop/src-tauri/target/release/d7-blackcore.exe
            D7-BLACKCORE/v2/apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
