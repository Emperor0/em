name: BLACKCORE 2.0 Windows Native

on:
  push:
    branches: ['blackcore-2.0', 'blackcore-2.0-dev*']
    paths:
      - 'D7-BLACKCORE/v2/apps/desktop/**'
      - 'D7-BLACKCORE/v2/VERSION'
      - '.github/workflows/blackcore-v2-windows.yml'
  workflow_dispatch:

concurrency:
  group: blackcore-v2-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: D7-BLACKCORE/v2/apps/desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            D7-BLACKCORE\v2\apps\desktop\src-tauri\target
          key: blackcore-v2-windows-rust-${{ hashFiles('D7-BLACKCORE/v2/apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            blackcore-v2-windows-rust-

      - name: Verify release version consistency
        shell: pwsh
        run: |
          $version = (Get-Content '..\..\VERSION' -Raw).Trim()
          $packageVersion = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
          $cargo = Get-Content 'src-tauri\Cargo.toml' -Raw
          $cargoMatch = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) { throw 'Cargo version not found' }
          $cargoVersion = $cargoMatch.Groups[1].Value
          Write-Host "VERSION=$version package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          if ($packageVersion -ne $version) { throw "package.json version mismatch: $packageVersion != $version" }
          if ($tauriVersion -ne $version) { throw "tauri.conf.json version mismatch: $tauriVersion != $version" }
          if ($cargoVersion -ne $version) { throw "Cargo.toml version mismatch: $cargoVersion != $version" }

      - name: Remove stale release outputs
        shell: pwsh
        run: |
          Remove-Item 'src-tauri\target\release\bundle' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'src-tauri\target\release\d7-blackcore.exe' -Force -ErrorAction SilentlyContinue
          Remove-Item 'artifact' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path 'artifact' | Out-Null

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend typecheck and build
        run: npm run build

      - name: Native Rust mission/runtime/protocol/mode tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      - name: Build Tauri Windows installer
        run: npm run tauri:build

      - name: Verify and stage clean native outputs
        shell: pwsh
        run: |
          $version = (Get-Content '..\..\VERSION' -Raw).Trim()
          $exe = Get-Item 'src-tauri\target\release\d7-blackcore.exe' -ErrorAction Stop
          $installers = @(Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' -File -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count): $($installers.Name -join ', ')" }
          $installer = $installers[0]
          if ($installer.Name -notmatch [regex]::Escape($version)) { throw "Installer filename does not contain version $version: $($installer.Name)" }
          if ($exe.Length -lt 1000000) { throw "Native executable unexpectedly small: $($exe.Length)" }
          if ($installer.Length -lt 1000000) { throw "Installer unexpectedly small: $($installer.Length)" }

          $stagedExe = Join-Path 'artifact' 'D7_BLACKCORE.exe'
          $stagedInstaller = Join-Path 'artifact' ("D7_BLACKCORE_{0}_x64-setup.exe" -f $version)
          Copy-Item $exe.FullName $stagedExe -Force
          Copy-Item $installer.FullName $stagedInstaller -Force

          $exeHash = (Get-FileHash $stagedExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash $stagedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          $info = [ordered]@{
            product = 'D7 BLACKCORE'
            version = $version
            commit = $env:GITHUB_SHA
            branch = $env:GITHUB_REF_NAME
            native_exe = [ordered]@{
              file = (Split-Path $stagedExe -Leaf)
              bytes = (Get-Item $stagedExe).Length
              sha256 = $exeHash
            }
            installer = [ordered]@{
              file = (Split-Path $stagedInstaller -Leaf)
              bytes = (Get-Item $stagedInstaller).Length
              sha256 = $installerHash
            }
            generated_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $info | ConvertTo-Json -Depth 6 | Set-Content 'artifact\BUILD_INFO.json' -Encoding UTF8

          $artifactFiles = @(Get-ChildItem 'artifact' -File)
          if ($artifactFiles.Count -ne 3) { throw "Expected exactly 3 staged files, found $($artifactFiles.Count)" }
          Write-Host "Native EXE: $stagedExe $((Get-Item $stagedExe).Length) bytes SHA256=$exeHash"
          Write-Host "Installer: $stagedInstaller $((Get-Item $stagedInstaller).Length) bytes SHA256=$installerHash"
          Get-Content 'artifact\BUILD_INFO.json'

      - uses: actions/upload-artifact@v4
        with:
          name: D7-BLACKCORE-${{ github.ref_name }}-Windows
          path: D7-BLACKCORE/v2/apps/desktop/artifact/*
          if-no-files-found: error
          retention-days: 14
