name: BLACKCORE 2 CI
on:
  push:
    branches: [blackcore-2.0]
    paths:
      - 'D7-BLACKCORE/v2/**'
      - '.github/workflows/blackcore-2-ci.yml'
  pull_request:
    paths:
      - 'D7-BLACKCORE/v2/**'

jobs:
  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: D7-BLACKCORE/v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run verify
