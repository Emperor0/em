name: Build BLACKCORE release

on:
  push:
    branches: [main]
    paths:
      - 'D7-BLACKCORE/release_chunks/**'
      - 'D7-BLACKCORE/release_chunks2/**'
      - '.github/workflows/blackcore-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify chunk set
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            D7-BLACKCORE/release_chunks/chunk_000.b64 \
            D7-BLACKCORE/release_chunks/chunk_001.b64 \
            D7-BLACKCORE/release_chunks/chunk_002.b64 \
            D7-BLACKCORE/release_chunks/chunk_003.b64 \
            D7-BLACKCORE/release_chunks/chunk_004.b64 \
            D7-BLACKCORE/release_chunks/chunk_005.b64 \
            D7-BLACKCORE/release_chunks/chunk_006.b64 \
            D7-BLACKCORE/release_chunks/chunk_007.b64 \
            D7-BLACKCORE/release_chunks/chunk_008.b64 \
            D7-BLACKCORE/release_chunks2/chunk_009.b64 \
            D7-BLACKCORE/release_chunks2/chunk_010.b64 \
            D7-BLACKCORE/release_chunks2/chunk_011.b64 \
            D7-BLACKCORE/release_chunks2/chunk_012.b64 \
            D7-BLACKCORE/release_chunks2/chunk_013_0.b64 \
            D7-BLACKCORE/release_chunks2/chunk_013_1.b64 \
            D7-BLACKCORE/release_chunks2/chunk_013_2.b64 \
            D7-BLACKCORE/release_chunks2/chunk_013_3.b64 \
            D7-BLACKCORE/release_chunks2/chunk_014.b64; do
            test -s "$f"
          done

      - name: Rebuild and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p D7-BLACKCORE/releases
          cat \
            D7-BLACKCORE/release_chunks/chunk_000.b64 \
            D7-BLACKCORE/release_chunks/chunk_001.b64 \
            D7-BLACKCORE/release_chunks/chunk_002.b64 \
            D7-BLACKCORE/release_chunks/chunk_003.b64 \
            D7-BLACKCORE/release_chunks/chunk_004.b64 \
            D7-BLACKCORE/release_chunks/chunk_005.b64 \
            D7-BLACKCORE/release_chunks/chunk_006.b64 \
            D7-BLACKCORE/release_chunks/chunk_007.b64 \
            D7-BLACKCORE/release_chunks/chunk_008.b64 \
            D7-BLACKCORE/release_chunks2/chunk_009.b64 \
            D7-BLACKCORE/release_chunks2/chunk_010.b64 \
            D7-BLACKCORE/release_chunks2/chunk_011.b64 \
            D7-BLACKCORE/release_chunks2/chunk_012.b64 \
            D7-BLACKCORE/release_chunks2/chunk_013_0.b64 \
            D7-BLACKCORE/release_chunks2/chunk_013_1.b64 \
            D7-BLACKCORE/release_chunks2/chunk_013_2.b64 \
            D7-BLACKCORE/release_chunks2/chunk_013_3.b64 \
            D7-BLACKCORE/release_chunks2/chunk_014.b64 \
            | base64 -d > D7-BLACKCORE/releases/D7_BLACKCORE_v1.0.3.zip
          echo "65124b4dc65fc69413a4d8d5a8e0250de1aa1fc67dd511a59d9022963b9a9e49  D7-BLACKCORE/releases/D7_BLACKCORE_v1.0.3.zip" | sha256sum -c -
          unzip -t D7-BLACKCORE/releases/D7_BLACKCORE_v1.0.3.zip

      - name: Publish verified ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f D7-BLACKCORE/releases/D7_BLACKCORE_v1.0.3.zip
          if git diff --cached --quiet; then
            echo "Release already current"
          else
            git commit -m "Publish verified BLACKCORE 1.0.3 release"
            git push
          fi
