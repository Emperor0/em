name: Build D7 BLACKCORE v2.1 Measurement Core

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d7-blackcore-v210-measurement.yml'
      - 'd7-gaming-engine/v210/measurement-core.ps1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose BLACKCORE v2.1 source
        shell: powershell
        run: |
          $base=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\v200\D7_BLACKCORE.ps1'
          $mod=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\v210\measurement-core.ps1'
          $outDir=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\v210'
          $out=Join-Path $outDir 'D7_BLACKCORE.ps1'
          $raw=Get-Content $base -Raw -Encoding UTF8
          $module=Get-Content $mod -Raw -Encoding UTF8
          $raw=$raw.Replace("`$Version='2.0.0'","`$Version='2.1.0'")
          $raw=$raw.Replace("`$form.Text='D7 BLACKCORE v2.0'","`$form.Text='D7 BLACKCORE v2.1'")
          $loadMarker="LoadGames`r`n`$form="
          if(-not $raw.Contains($loadMarker)){throw 'LoadGames/form marker missing'}
          $raw=$raw.Replace($loadMarker,($module+"`r`n`r`nLoadGames`r`n`$form="))
          $oldButtons="`$bTools=Btn 'TOOL HUB' 30 170 190;`$bWinget=Btn 'REVIEW APP UPDATES' 235 170 190;`$bFolder=Btn 'OPEN SCANS' 440 170 190"
          $newButtons="`$bTools=Btn 'TOOL HUB' 30 170 190;`$bWinget=Btn 'REVIEW APP UPDATES' 235 170 190;`$bFolder=Btn 'OPEN SCANS' 440 170 190;`$bMeasure=Btn 'MEASURE BASELINE' 645 170 190;`$bLatency=Btn 'LATENCY LAB' 850 170 120;`$bCompare=Btn 'A/B COMPARE' 980 170 100"
          if(-not $raw.Contains($oldButtons)){throw 'Tool UI marker missing'}
          $raw=$raw.Replace($oldButtons,$newButtons)
          $handler="`$bMeasure.Add_Click({`$stat.Text='State: MEASURING';`$stat.ForeColor=[Drawing.Color]::DeepSkyBlue;[void](Run-MeasurementBaseline);`$stat.Text='State: MEASUREMENT COMPLETE';`$stat.ForeColor=[Drawing.Color]::LawnGreen})`r`n`$bLatency.Add_Click({[void](Run-LatencyAudit)})`r`n`$bCompare.Add_Click({Compare-LastMeasurements})`r`n"
          $timerMarker="`$timer=New-Object Windows.Forms.Timer;"
          if(-not $raw.Contains($timerMarker)){throw 'Timer marker missing'}
          $raw=$raw.Replace($timerMarker,($handler+$timerMarker))
          $raw=[regex]::Replace($raw,'\breturn(?=\$|\[|\()','return ')
          $raw=[regex]::Replace($raw,'\bif(?=\()','if ')
          $raw=[regex]::Replace($raw,'\bforeach(?=\()','foreach ')
          [IO.File]::WriteAllText($out,$raw,(New-Object Text.UTF8Encoding($true)))
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($out,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Host ('PARSER: '+$_.Message+' line '+$_.Extent.StartLineNumber)};throw ('Parser errors: '+$errors.Count)}
          foreach($bad in @('return$false','return$true','return$null','return[','return(')){if($raw.Contains($bad)){throw ('Runtime-dangerous token remains: '+$bad)}}
          "D7_SRC=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force

      - name: Build D7 BLACKCORE v2.1
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'D7Blackcore210';New-Item $out -ItemType Directory -Force|Out-Null
          $iconPath=Join-Path $env:RUNNER_TEMP 'D7.ico';$oldPkg=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable\D7_BLACKCORE_v2.0.1.zip'
          if(Test-Path $oldPkg){$tmp=Join-Path $env:RUNNER_TEMP 'Old';Expand-Archive $oldPkg $tmp -Force;$old=Get-ChildItem $tmp -Recurse -Filter D7_Gaming_Engine.exe|Select-Object -First 1;if($old){Add-Type -AssemblyName System.Drawing;$ic=[Drawing.Icon]::ExtractAssociatedIcon($old.FullName);$st=[IO.File]::Create($iconPath);try{$ic.Save($st)}finally{$st.Dispose();$ic.Dispose()}}}
          $a=@{inputFile=$env:D7_SRC;outputFile=(Join-Path $out 'D7_Gaming_Engine.exe');x64=$true;STA=$true;noConsole=$true;requireAdmin=$true;title='D7 BLACKCORE';product='D7 BLACKCORE Gaming System Orchestrator';company='D7';version='2.1.0.0'};if(Test-Path $iconPath){$a.iconFile=$iconPath};Invoke-ps2exe @a
          Set-Content (Join-Path $out 'version.txt') '2.1.0' -Encoding ASCII
          Set-Content (Join-Path $out 'README_MEASUREMENT.txt') @'
          D7 BLACKCORE v2.1
          Measurement-first release.
          New: deep tool detection, PresentMon integration when available, frametime/1%/0.1% analysis, stability event audit, MSI/interrupt read-only audit, network advanced-property audit, A/B comparison.
          This release does NOT automatically change interrupt affinity, MSI mode, network offloads, BIOS, RAM timings, CPU voltage, or GPU overclock.
          '@ -Encoding UTF8
          "D7_OUT=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package and publish stable
        shell: powershell
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'D7_BLACKCORE_v2.1.0.zip';Compress-Archive -Path (Join-Path $env:D7_OUT '*') -DestinationPath $zip -Force
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$stable=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable';Copy-Item $zip (Join-Path $stable 'D7_BLACKCORE_v2.1.0.zip') -Force
          $m=[ordered]@{product='D7 BLACKCORE';channel='stable';version='2.1.0';minimumWindowsBuild=19045;updateMode='online-only';packageUrl='https://raw.githubusercontent.com/Emperor0/em/main/d7-gaming-engine/stable/D7_BLACKCORE_v2.1.0.zip';sha256=$hash;changelogAr='Measurement Core: improved tool detection, PresentMon capture and frametime analysis, stability/WHEA audit, MSI and interrupt read-only audit, deep network audit, A/B compare. No blind low-level tuning.';publishedUtc=(Get-Date).ToUniversalTime().ToString('o')}
          [IO.File]::WriteAllText((Join-Path $stable 'latest.json'),($m|ConvertTo-Json -Depth 5),(New-Object Text.UTF8Encoding($false)))
          git config user.name 'D7 Release Bot';git config user.email 'd7-release-bot@users.noreply.github.com'
          git add d7-gaming-engine/v210/D7_BLACKCORE.ps1 d7-gaming-engine/stable/D7_BLACKCORE_v2.1.0.zip d7-gaming-engine/stable/latest.json
          git commit -m 'Publish D7 BLACKCORE v2.1.0 Measurement Core'
          git pull --rebase origin main
          git push
          "D7_ZIP=$zip"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: D7-BLACKCORE-v2.1.0-Windows
          path: ${{ env.D7_ZIP }}
          retention-days: 30
