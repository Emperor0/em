name: D7 Media Cloud

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [d7_generate]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap D7 runner
        run: python runner/bootstrap.py
      - name: Validate Python
        working-directory: runner
        run: python -m compileall -q pipeline
      - name: Install renderer dependencies
        working-directory: runner
        run: npm install
      - name: Validate renderer entry
        working-directory: runner
        run: node --check render/render.mjs

  materialize:
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand bundled source
        run: python runner/bootstrap.py
      - name: Commit materialized source
        run: |
          git config user.name "D7 Media Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add runner/pipeline runner/remotion runner/render runner/package.json runner/requirements.txt
          git diff --cached --quiet && exit 0
          git commit -m "Materialize D7 Media Cloud runner source"
          git push

  generate:
    if: github.event_name != 'push' && vars.D7_ENABLED == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      D7_JOB_ID: ${{ github.event.client_payload.job_id || github.run_id }}
      D7_CALLBACK_URL: ${{ secrets.D7_CALLBACK_URL }}
      D7_CALLBACK_SECRET: ${{ secrets.D7_CALLBACK_SECRET }}

      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      CF_TEXT_MODEL: "@cf/zai-org/glm-4.7-flash"
      CF_TTS_MODEL: "@cf/myshell-ai/melotts"
      CF_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_VIDEO_SPACE: ${{ vars.HF_VIDEO_SPACE || 'Upsampler/wan-2-2-5b-video' }}
      HF_VIDEO_API_NAME: ${{ vars.HF_VIDEO_API_NAME }}
      HF_VIDEO_ARGS_JSON: ${{ vars.HF_VIDEO_ARGS_JSON || '{}' }}
      HF_MAX_GPU_JOBS: "1"

      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY: "private"

      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_DIRECT_POST_APPROVED: ${{ vars.TIKTOK_DIRECT_POST_APPROVED || 'false' }}
      TIKTOK_PRIVACY: "SELF_ONLY"

      MIN_SCORE: "82"
      MAX_DAILY_POSTS: "2"
      ZERO_COST: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap D7 runner
        run: python runner/bootstrap.py
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python
        working-directory: runner
        run: pip install -r requirements.txt beautifulsoup4
      - name: Install Renderer
        working-directory: runner
        run: npm install
      - name: Generate, render and publish
        working-directory: runner
        run: python -m pipeline.main
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d7-${{ env.D7_JOB_ID }}
          path: runner/output/${{ env.D7_JOB_ID }}
          retention-days: 3
