name: D7 Media Cloud

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [d7_generate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        working-directory: runner
        run: pip install -r requirements.txt beautifulsoup4
      - name: Validate Python
        working-directory: runner
        run: python -m compileall -q pipeline
      - name: Install renderer dependencies
        working-directory: runner
        run: npm install
      - name: Validate renderer entry
        working-directory: runner
        run: node --check render/render.mjs
      - name: Live discovery and render smoke test
        working-directory: runner
        run: python -m pipeline.smoke
      - name: Upload smoke video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d7-smoke-${{ github.run_id }}
          path: runner/output/smoke
          retention-days: 1

  h3-quality-test:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ZeroGPU client
        run: pip install "gradio_client>=1.13.1"
      - name: Generate one premium H3 hero shot
        working-directory: runner
        run: python -m pipeline.h3_smoke
      - name: Upload H3 hero shot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d7-h3-hero-${{ github.run_id }}
          path: runner/output/h3-smoke
          retention-days: 1

  generate:
    if: github.event_name != 'push' && vars.D7_ENABLED == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      D7_JOB_ID: ${{ github.event.client_payload.job_id || github.run_id }}
      D7_CALLBACK_URL: ${{ secrets.D7_CALLBACK_URL }}
      D7_CALLBACK_SECRET: ${{ secrets.D7_CALLBACK_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      CF_TEXT_MODEL: "@cf/zai-org/glm-4.7-flash"
      CF_TTS_MODEL: "@cf/myshell-ai/melotts"
      CF_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
      VOICE_ENGINE: "edge"
      EDGE_VOICE: "en-US-BrianMultilingualNeural"
      EDGE_RATE: "+4%"
      EDGE_PITCH: "-2Hz"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_VIDEO_SPACE: ${{ vars.HF_VIDEO_SPACE || 'OpenKing/wan2-video-generation' }}
      HF_VIDEO_API_NAME: ${{ vars.HF_VIDEO_API_NAME }}
      HF_VIDEO_ARGS_JSON: ${{ vars.HF_VIDEO_ARGS_JSON || '{}' }}
      HF_MAX_GPU_JOBS: "1"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY: "private"
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_DIRECT_POST_APPROVED: ${{ vars.TIKTOK_DIRECT_POST_APPROVED || 'false' }}
      TIKTOK_PRIVACY: "SELF_ONLY"
      MIN_SCORE: "84"
      MIN_SCENES: "14"
      MAX_SCENE_SECONDS: "2.6"
      MIN_VIDEO_ASSET_RATIO: "0.60"
      MAX_STILL_RATIO: "0.10"
      MIN_FINAL_WIDTH: "1080"
      MIN_FINAL_HEIGHT: "1920"
      MIN_FINAL_FPS: "29"
      MIN_FINAL_BITRATE: "7000000"
      MAX_DAILY_POSTS: "2"
      ZERO_COST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python
        working-directory: runner
        run: pip install -r requirements.txt beautifulsoup4
      - name: Install Renderer
        working-directory: runner
        run: npm install
      - name: Generate, render, quality-check and publish
        working-directory: runner
        run: python -m pipeline.main
      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d7-${{ env.D7_JOB_ID }}
          path: runner/output/${{ env.D7_JOB_ID }}
          retention-days: 3
