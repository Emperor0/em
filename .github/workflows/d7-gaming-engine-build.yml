name: Build D7 Gaming Engine

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d7-gaming-engine-build.yml'

permissions:
  contents: write

concurrency:
  group: d7-gaming-engine-stable
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand D7 premium source
        shell: powershell
        run: |
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable\D7_Gaming_Engine_v0.8.0.zip'
          if (-not (Test-Path $pkg)) { throw 'Stable D7 v0.8.0 source package is missing.' }
          $work = Join-Path $env:RUNNER_TEMP 'D7Source'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Expand-Archive -Path $pkg -DestinationPath $work -Force

          $scriptFile = Get-ChildItem $work -Recurse -File -Filter 'D7_Gaming_Engine.ps1' | Select-Object -First 1
          if (-not $scriptFile) { throw 'D7_Gaming_Engine.ps1 was not found in v0.8.0 package.' }
          $src = $scriptFile.Directory.FullName
          $icon = Get-ChildItem $src -File -Filter 'D7_Gaming_Engine.ico' | Select-Object -First 1
          if (-not $icon) { throw 'D7 icon was not found in premium source package.' }

          # Promote the source to v0.8.1 and enforce the online stable channel.
          $scriptText = Get-Content $scriptFile.FullName -Raw -Encoding UTF8
          $scriptText = $scriptText -replace "\$D7Version\s*=\s*'0\.8\.0'", "`$D7Version = '0.8.1'"
          [IO.File]::WriteAllText($scriptFile.FullName, $scriptText, (New-Object Text.UTF8Encoding($true)))

          $configPath = Join-Path $src 'config.json'
          if (Test-Path $configPath) {
            $cfg = Get-Content $configPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $cfg.UpdateManifestUrl = 'https://raw.githubusercontent.com/Emperor0/em/main/d7-gaming-engine/stable/latest.json'
            $cfg | ConvertTo-Json -Depth 10 | Set-Content $configPath -Encoding UTF8
          }
          Set-Content (Join-Path $src 'version.txt') -Value '0.8.1' -Encoding ASCII
          @'
D7 Gaming Engine v0.8.1
- تطبيق Windows EXE مستقل 64-بت بصلاحية المسؤول.
- هوية D7 الداكنة الفاخرة مع الأخضر الكهربائي واللمسة السماوية.
- واجهة عربية RTL حديثة بالكامل.
- قناة تحديثات Stable مرتبطة أونلاين عبر GitHub.
- تحقق SHA-256 من كل حزمة تحديث قبل التثبيت.
- دعم الاسترجاع الآمن وتشغيل النسخة الجديدة تلقائياً بعد التحديث.
'@ | Set-Content (Join-Path $src 'CHANGELOG_AR.txt') -Encoding UTF8
          "D7_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force

      - name: Build Windows EXE
        shell: powershell
        run: |
          $src = $env:D7_SRC
          $out = Join-Path $env:RUNNER_TEMP 'D7Release'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $out 'tools') -Force | Out-Null

          Invoke-ps2exe `
            -inputFile (Join-Path $src 'D7_Gaming_Engine.ps1') `
            -outputFile (Join-Path $out 'D7_Gaming_Engine.exe') `
            -x64 -STA -noConsole -requireAdmin `
            -iconFile (Join-Path $src 'D7_Gaming_Engine.ico') `
            -title 'D7 Gaming Engine' `
            -product 'D7 Gaming Engine' `
            -company 'D7' `
            -copyright 'D7' `
            -version '0.8.1.0'

          foreach ($name in @('config.json','README_AR.txt','CHANGELOG_AR.txt','version.txt','D7_Gaming_Engine.ico')) {
            $p = Join-Path $src $name
            if (Test-Path $p) { Copy-Item $p $out -Force }
          }
          $license = Join-Path $src 'tools\PRESENTMON_LICENSE.txt'
          if (Test-Path $license) { Copy-Item $license (Join-Path $out 'tools\PRESENTMON_LICENSE.txt') -Force }

          $exe = Join-Path $out 'D7_Gaming_Engine.exe'
          if (-not (Test-Path $exe)) { throw 'EXE build failed.' }
          if ((Get-Item $exe).Length -lt 50000) { throw 'EXE build output is unexpectedly small.' }
          Write-Host "D7 EXE size: $((Get-Item $exe).Length) bytes"

      - name: Package stable release and manifest
        shell: powershell
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $src = $env:D7_SRC
          $out = Join-Path $env:RUNNER_TEMP 'D7Release'
          $stable = Join-Path $repo 'd7-gaming-engine\stable'
          New-Item -ItemType Directory -Path $stable -Force | Out-Null
          $zipName = 'D7_Gaming_Engine_v0.8.1.zip'
          $zip = Join-Path $stable $zipName
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = (Get-Content (Join-Path $src 'CHANGELOG_AR.txt') -Raw -Encoding UTF8).Trim()
          $manifest = [ordered]@{
            product = 'D7 Gaming Engine'
            channel = 'stable'
            version = '0.8.1'
            minimumWindowsBuild = 19045
            packageUrl = 'https://raw.githubusercontent.com/Emperor0/em/main/d7-gaming-engine/stable/D7_Gaming_Engine_v0.8.1.zip'
            sha256 = $hash
            changelogAr = $notes
            publishedUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path $stable 'latest.json'), $json, (New-Object Text.UTF8Encoding($false)))
          Write-Host "Release SHA256: $hash"

      - name: Upload D7 package artifact
        uses: actions/upload-artifact@v4
        with:
          name: D7-Gaming-Engine-v0.8.1
          path: d7-gaming-engine/stable/D7_Gaming_Engine_v0.8.1.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable channel
        shell: powershell
        run: |
          git config user.name 'D7 Release Bot'
          git config user.email 'd7-release-bot@users.noreply.github.com'
          git add d7-gaming-engine/stable
          if (git diff --cached --quiet) { Write-Host 'No release changes to publish.'; exit 0 }
          git commit -m 'Publish D7 Gaming Engine v0.8.1 EXE'
          git pull --rebase origin main
          git push
