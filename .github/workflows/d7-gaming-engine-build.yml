name: Build D7 Gaming Engine

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d7-gaming-engine-build.yml'

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate D7 Windows package
        shell: powershell
        run: |
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable\D7_Gaming_Engine_v0.8.0.zip'
          if (-not (Test-Path $pkg)) { throw 'D7 stable package is missing.' }
          $work = Join-Path $env:RUNNER_TEMP 'D7Validate'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Expand-Archive -Path $pkg -DestinationPath $work -Force
          Write-Host '--- D7 package contents ---'
          Get-ChildItem $work -Recurse -File | ForEach-Object { Write-Host ($_.FullName + ' | ' + $_.Length + ' bytes') }
          $exe = Get-ChildItem $work -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -match 'D7' } | Select-Object -First 1
          if (-not $exe) { throw 'No D7 Windows EXE found in stable package.' }
          if ($exe.Length -lt 50000) { throw 'D7 EXE is unexpectedly small.' }
          Write-Host ('Validated EXE: ' + $exe.FullName)
          Write-Host ('EXE size: ' + $exe.Length)
          Write-Host ('Package SHA256: ' + (Get-FileHash $pkg -Algorithm SHA256).Hash.ToLowerInvariant())

      - name: Upload D7 Windows package
        uses: actions/upload-artifact@v4
        with:
          name: D7-Gaming-Engine-v0.8.0-Windows
          path: d7-gaming-engine/stable/D7_Gaming_Engine_v0.8.0.zip
          if-no-files-found: error
          retention-days: 30
