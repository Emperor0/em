name: Build D7 Gaming Engine v1.0 Adaptive Performance Engine

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d7-gaming-engine-build.yml'
      - 'd7-gaming-engine/v100/**'

permissions:
  contents: write

concurrency:
  group: d7-gaming-engine-stable
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and validate v1.0 source
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\v100'
          $src = Join-Path $env:RUNNER_TEMP 'D7v100Source'
          Remove-Item $src -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $src -Force | Out-Null
          $b64 = (Get-Content (Join-Path $root 'source_all.txt') -Raw -Encoding UTF8) -replace '[^A-Za-z0-9+/=]',''
          $gzBytes = [Convert]::FromBase64String($b64)
          $inStream = New-Object IO.MemoryStream(,$gzBytes)
          $gzip = New-Object IO.Compression.GzipStream($inStream,[IO.Compression.CompressionMode]::Decompress)
          $reader = New-Object IO.StreamReader($gzip,[Text.Encoding]::UTF8)
          try { $scriptText = $reader.ReadToEnd() } finally { $reader.Dispose(); $gzip.Dispose(); $inStream.Dispose() }
          [IO.File]::WriteAllText((Join-Path $src 'D7_Gaming_Engine.ps1'),$scriptText,(New-Object Text.UTF8Encoding($true)))
          Copy-Item (Join-Path $root 'README_AR.txt') $src -Force
          Copy-Item (Join-Path $root 'CHANGELOG_AR.txt') $src -Force
          [IO.File]::WriteAllText((Join-Path $src 'version.txt'),'1.0.0',(New-Object Text.UTF8Encoding($false)))

          $oldPkg = Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable\D7_Gaming_Engine_v0.9.7.zip'
          if (-not (Test-Path $oldPkg)) { throw 'D7 v0.9.7 package missing.' }
          $old = Join-Path $env:RUNNER_TEMP 'D7Old'
          Remove-Item $old -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $oldPkg -DestinationPath $old -Force
          $oldExe = Get-ChildItem $old -Recurse -File -Filter 'D7_Gaming_Engine.exe' | Select-Object -First 1
          if (-not $oldExe) { throw 'Existing D7 EXE missing.' }
          Add-Type -AssemblyName System.Drawing
          $icon = [Drawing.Icon]::ExtractAssociatedIcon($oldExe.FullName)
          $stream = [IO.File]::Create((Join-Path $src 'D7_Gaming_Engine.ico'))
          try { $icon.Save($stream) } finally { $stream.Dispose(); $icon.Dispose() }

          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $src 'D7_Gaming_Engine.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ('PARSER: '+$_.Message+' line '+$_.Extent.StartLineNumber) }
            throw ('Parser errors: '+$errors.Count)
          }
          Write-Host ('v1.0 source bytes: '+(Get-Item (Join-Path $src 'D7_Gaming_Engine.ps1')).Length)
          "D7_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force

      - name: Build D7 v1.0 Windows EXE
        shell: powershell
        run: |
          $src=$env:D7_SRC
          $out=Join-Path $env:RUNNER_TEMP 'D7Release'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Invoke-ps2exe -inputFile (Join-Path $src 'D7_Gaming_Engine.ps1') -outputFile (Join-Path $out 'D7_Gaming_Engine.exe') -x64 -STA -noConsole -requireAdmin -iconFile (Join-Path $src 'D7_Gaming_Engine.ico') -title 'D7 Gaming Engine' -product 'D7 Gaming Engine Adaptive Performance Engine' -company 'D7' -copyright 'D7' -version '1.0.0.0'
          foreach($n in @('README_AR.txt','CHANGELOG_AR.txt','version.txt')) { Copy-Item (Join-Path $src $n) $out -Force }
          $exe=Join-Path $out 'D7_Gaming_Engine.exe'
          if (-not (Test-Path $exe)) { throw 'Build failed.' }
          if ((Get-Item $exe).Length -lt 40000) { throw 'EXE too small.' }
          $ver=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($ver.FileVersion -notlike '1.0.0*') { throw 'EXE version mismatch.' }
          Write-Host ('EXE bytes: '+(Get-Item $exe).Length)
          Write-Host ('EXE version: '+$ver.FileVersion)
          "D7_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package v1.0
        shell: powershell
        run: |
          $out=$env:D7_OUT
          $zip=Join-Path $env:RUNNER_TEMP 'D7_Gaming_Engine_v1.0.0.zip'
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ('Package SHA256: '+$hash)
          "D7_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "D7_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish stable v1.0 online channel
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $repo=$env:GITHUB_WORKSPACE; $src=$env:D7_SRC; $zip=$env:D7_ZIP; $hash=$env:D7_HASH
          $stable=Join-Path $repo 'd7-gaming-engine\stable'
          $dest=Join-Path $stable 'D7_Gaming_Engine_v1.0.0.zip'
          Copy-Item $zip $dest -Force
          $notes=(Get-Content (Join-Path $src 'CHANGELOG_AR.txt') -Raw -Encoding UTF8).Trim()
          $m=[ordered]@{
            product='D7 Gaming Engine'
            channel='stable'
            version='1.0.0'
            minimumWindowsBuild=19045
            updateMode='online-only'
            packageUrl='https://raw.githubusercontent.com/Emperor0/em/main/d7-gaming-engine/stable/D7_Gaming_Engine_v1.0.0.zip'
            sha256=$hash
            changelogAr=$notes
            publishedUtc=(Get-Date).ToUniversalTime().ToString('o')
          }
          [IO.File]::WriteAllText((Join-Path $stable 'latest.json'),($m|ConvertTo-Json -Depth 5),(New-Object Text.UTF8Encoding($false)))
          git config user.name 'D7 Release Bot'
          git config user.email 'd7-release-bot@users.noreply.github.com'
          git add d7-gaming-engine/stable/D7_Gaming_Engine_v1.0.0.zip d7-gaming-engine/stable/latest.json
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Publish D7 Gaming Engine v1.0 Adaptive Performance Engine'
            git pull --rebase origin main
            git push
          }

      - name: Upload D7 v1.0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: D7-Gaming-Engine-v1.0.0-Windows
          path: ${{ env.D7_ZIP }}
          if-no-files-found: error
          retention-days: 30
