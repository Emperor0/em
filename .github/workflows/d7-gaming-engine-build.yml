name: Build D7 Gaming Engine

on:
  workflow_dispatch:
  push:
    paths:
      - 'd7-gaming-engine/source/D7_Source_v0.8.1.zip'
      - '.github/workflows/d7-gaming-engine-build.yml'

permissions:
  contents: write

concurrency:
  group: d7-gaming-engine-stable
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand verified source package
        shell: powershell
        run: |
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\source\D7_Source_v0.8.1.zip'
          $work = Join-Path $env:RUNNER_TEMP 'D7Source'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Expand-Archive -Path $pkg -DestinationPath $work -Force
          $src = Join-Path $work 'source'
          if (-not (Test-Path (Join-Path $src 'D7_Gaming_Engine.ps1'))) { throw 'D7 source package is incomplete.' }
          if (-not (Test-Path (Join-Path $src 'D7_Gaming_Engine.ico'))) { throw 'D7 icon is missing.' }
          "D7_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force

      - name: Build Windows EXE
        shell: powershell
        run: |
          $src = $env:D7_SRC
          $out = Join-Path $env:RUNNER_TEMP 'D7Release'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $out 'tools') -Force | Out-Null

          Invoke-ps2exe `
            -inputFile (Join-Path $src 'D7_Gaming_Engine.ps1') `
            -outputFile (Join-Path $out 'D7_Gaming_Engine.exe') `
            -x64 -STA -noConsole -requireAdmin `
            -iconFile (Join-Path $src 'D7_Gaming_Engine.ico') `
            -title 'D7 Gaming Engine' `
            -product 'D7 Gaming Engine' `
            -company 'D7' `
            -copyright 'D7' `
            -version '0.8.1.0'

          Copy-Item (Join-Path $src 'config.json') $out -Force
          Copy-Item (Join-Path $src 'README_AR.txt') $out -Force
          Copy-Item (Join-Path $src 'CHANGELOG_AR.txt') $out -Force
          Copy-Item (Join-Path $src 'version.txt') $out -Force
          Copy-Item (Join-Path $src 'D7_Gaming_Engine.ico') $out -Force
          Copy-Item (Join-Path $src 'tools\PRESENTMON_LICENSE.txt') (Join-Path $out 'tools\PRESENTMON_LICENSE.txt') -Force

          $exe = Join-Path $out 'D7_Gaming_Engine.exe'
          if (-not (Test-Path $exe)) { throw 'EXE build failed.' }
          if ((Get-Item $exe).Length -lt 50000) { throw 'EXE build output is unexpectedly small.' }
          Write-Host "D7 EXE size: $((Get-Item $exe).Length) bytes"

      - name: Package stable release and manifest
        shell: powershell
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $src = $env:D7_SRC
          $out = Join-Path $env:RUNNER_TEMP 'D7Release'
          $stable = Join-Path $repo 'd7-gaming-engine\stable'
          New-Item -ItemType Directory -Path $stable -Force | Out-Null

          $zipName = 'D7_Gaming_Engine_v0.8.1.zip'
          $zip = Join-Path $stable $zipName
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = (Get-Content (Join-Path $src 'CHANGELOG_AR.txt') -Raw -Encoding UTF8).Trim()
          $manifest = [ordered]@{
            product = 'D7 Gaming Engine'
            channel = 'stable'
            version = '0.8.1'
            minimumWindowsBuild = 19045
            packageUrl = 'https://raw.githubusercontent.com/Emperor0/em/main/d7-gaming-engine/stable/D7_Gaming_Engine_v0.8.1.zip'
            sha256 = $hash
            changelogAr = $notes
            publishedUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText((Join-Path $stable 'latest.json'), $json, $utf8)
          Write-Host "Release SHA256: $hash"

      - name: Upload D7 package artifact
        uses: actions/upload-artifact@v4
        with:
          name: D7-Gaming-Engine-v0.8.1
          path: d7-gaming-engine/stable/D7_Gaming_Engine_v0.8.1.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable channel
        shell: powershell
        run: |
          git config user.name 'D7 Release Bot'
          git config user.email 'd7-release-bot@users.noreply.github.com'
          git add d7-gaming-engine/stable
          if (git diff --cached --quiet) {
            Write-Host 'No release changes to publish.'
            exit 0
          }
          git commit -m 'Publish D7 Gaming Engine v0.8.1 EXE'
          git push
