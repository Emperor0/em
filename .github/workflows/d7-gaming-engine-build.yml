name: Build D7 Gaming Engine Safe Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d7-gaming-engine-build.yml'

permissions:
  contents: write

concurrency:
  group: d7-gaming-engine-stable
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.9.1 Safe Recovery source
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'D7v091Source'
          Remove-Item $src -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $src -Force | Out-Null

          $b64 = ''
          $gzBytes = [Convert]::FromBase64String($b64)
          $inStream = New-Object IO.MemoryStream(,$gzBytes)
          $gzip = New-Object IO.Compression.GzipStream($inStream,[IO.Compression.CompressionMode]::Decompress)
          $reader = New-Object IO.StreamReader($gzip,[Text.Encoding]::UTF8)
          try { $scriptText = $reader.ReadToEnd() } finally { $reader.Dispose(); $gzip.Dispose(); $inStream.Dispose() }
          [IO.File]::WriteAllText((Join-Path $src 'D7_Gaming_Engine.ps1'),$scriptText,(New-Object Text.UTF8Encoding($true)))

          [IO.File]::WriteAllBytes((Join-Path $src 'config.json'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $src 'README_AR.txt'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $src 'CHANGELOG_AR.txt'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllText((Join-Path $src 'version.txt'),'0.9.1',(New-Object Text.UTF8Encoding($false)))

          $oldPkg = Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable\D7_Gaming_Engine_v0.8.0.zip'
          $old = Join-Path $env:RUNNER_TEMP 'D7v080'
          Remove-Item $old -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $oldPkg -DestinationPath $old -Force
          $oldExe = Get-ChildItem $old -Recurse -File -Filter 'D7_Gaming_Engine.exe' | Select-Object -First 1
          if (-not $oldExe) { throw 'Base D7 EXE missing; cannot preserve icon.' }
          Add-Type -AssemblyName System.Drawing
          $icon = [Drawing.Icon]::ExtractAssociatedIcon($oldExe.FullName)
          if (-not $icon) { throw 'Could not extract D7 icon.' }
          $iconStream = [IO.File]::Create((Join-Path $src 'D7_Gaming_Engine.ico'))
          try { $icon.Save($iconStream) } finally { $iconStream.Dispose(); $icon.Dispose() }

          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $src 'D7_Gaming_Engine.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){
            $errors | ForEach-Object { Write-Host ('PARSER: '+$_.Message+' @ '+$_.Extent.StartLineNumber) }
            throw ('Parser errors: '+$errors.Count)
          }
          "D7_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force

      - name: Build v0.9.1 Windows EXE
        shell: powershell
        run: |
          $src=$env:D7_SRC
          $out=Join-Path $env:RUNNER_TEMP 'D7Release'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Invoke-ps2exe `
            -inputFile (Join-Path $src 'D7_Gaming_Engine.ps1') `
            -outputFile (Join-Path $out 'D7_Gaming_Engine.exe') `
            -x64 -STA -noConsole -requireAdmin `
            -iconFile (Join-Path $src 'D7_Gaming_Engine.ico') `
            -title 'D7 Gaming Engine' `
            -product 'D7 Gaming Engine' `
            -company 'D7' `
            -copyright 'D7' `
            -version '0.9.1.0'
          foreach($n in @('config.json','README_AR.txt','CHANGELOG_AR.txt','version.txt')){Copy-Item (Join-Path $src $n) $out -Force}
          $exe=Join-Path $out 'D7_Gaming_Engine.exe'
          if(-not(Test-Path $exe)){throw 'D7 Safe Recovery EXE build failed.'}
          if((Get-Item $exe).Length -lt 50000){throw 'D7 Safe Recovery EXE unexpectedly small.'}
          Write-Host ('EXE size: '+(Get-Item $exe).Length)
          "D7_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish stable v0.9.1 Safe Recovery
        shell: powershell
        run: |
          $repo=$env:GITHUB_WORKSPACE
          $src=$env:D7_SRC
          $out=$env:D7_OUT
          $stable=Join-Path $repo 'd7-gaming-engine\stable'
          New-Item -ItemType Directory -Path $stable -Force | Out-Null
          $zip=Join-Path $stable 'D7_Gaming_Engine_v0.9.1.zip'
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes=(Get-Content (Join-Path $src 'CHANGELOG_AR.txt') -Raw -Encoding UTF8).Trim()
          $manifest=[ordered]@{
            product='D7 Gaming Engine'
            channel='stable'
            version='0.9.1'
            minimumWindowsBuild=19045
            packageUrl='https://raw.githubusercontent.com/Emperor0/em/main/d7-gaming-engine/stable/D7_Gaming_Engine_v0.9.1.zip'
            sha256=$hash
            changelogAr=$notes
            publishedUtc=(Get-Date).ToUniversalTime().ToString('o')
          }
          [IO.File]::WriteAllText((Join-Path $stable 'latest.json'),($manifest|ConvertTo-Json -Depth 5),(New-Object Text.UTF8Encoding($false)))
          Write-Host ('Stable package SHA256: '+$hash)
          git config user.name 'D7 Release Bot'
          git config user.email 'd7-release-bot@users.noreply.github.com'
          git add d7-gaming-engine/stable/D7_Gaming_Engine_v0.9.1.zip d7-gaming-engine/stable/latest.json
          git commit -m 'Emergency publish D7 v0.9.1 Safe Recovery'
          git pull --rebase origin main
          git push

      - name: Upload v0.9.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: D7-Gaming-Engine-v0.9.1-Safe-Recovery
          path: d7-gaming-engine/stable/D7_Gaming_Engine_v0.9.1.zip
          if-no-files-found: error
          retention-days: 30
