name: Build D7 Gaming Engine Doctor Core

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d7-gaming-engine-build.yml'

permissions:
  contents: write

concurrency:
  group: d7-gaming-engine-stable
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.9.2 Doctor Core source
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'D7v092Source'
          Remove-Item $src -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $src 'tools') -Force | Out-Null
          $b64 = ''
          $gzBytes = [Convert]::FromBase64String($b64)
          $inStream = New-Object IO.MemoryStream(,$gzBytes)
          $gzip = New-Object IO.Compression.GzipStream($inStream,[IO.Compression.CompressionMode]::Decompress)
          $reader = New-Object IO.StreamReader($gzip,[Text.Encoding]::UTF8)
          try { $scriptText = $reader.ReadToEnd() } finally { $reader.Dispose(); $gzip.Dispose(); $inStream.Dispose() }
          [IO.File]::WriteAllText((Join-Path $src 'D7_Gaming_Engine.ps1'),$scriptText,(New-Object Text.UTF8Encoding($true)))
          [IO.File]::WriteAllText((Join-Path $src 'version.txt'),'0.9.2',(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllBytes((Join-Path $src 'CHANGELOG_AR.txt'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $src 'README_AR.txt'),[Convert]::FromBase64String(''))
          $oldPkg = Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable\D7_Gaming_Engine_v0.9.0.zip'
          if (-not (Test-Path $oldPkg)) { $oldPkg = Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable\D7_Gaming_Engine_v0.8.0.zip' }
          $old = Join-Path $env:RUNNER_TEMP 'D7Old'
          Expand-Archive -Path $oldPkg -DestinationPath $old -Force
          $oldExe = Get-ChildItem $old -Recurse -File -Filter 'D7_Gaming_Engine.exe' | Select-Object -First 1
          if (-not $oldExe) { throw 'Existing D7 EXE missing.' }
          Add-Type -AssemblyName System.Drawing
          $icon=[Drawing.Icon]::ExtractAssociatedIcon($oldExe.FullName)
          $stream=[IO.File]::Create((Join-Path $src 'D7_Gaming_Engine.ico'))
          try { $icon.Save($stream) } finally { $stream.Dispose();$icon.Dispose() }
          $lic=Join-Path $old 'tools\PRESENTMON_LICENSE.txt'
          if(Test-Path $lic){Copy-Item $lic (Join-Path $src 'tools\PRESENTMON_LICENSE.txt') -Force}
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $src 'D7_Gaming_Engine.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|%{Write-Host ('PARSER '+$_.Message+' line '+$_.Extent.StartLineNumber)};throw ('Parser errors: '+$errors.Count)}
          "D7_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force

      - name: Build D7 v0.9.2 Windows EXE
        shell: powershell
        run: |
          $src=$env:D7_SRC;$out=Join-Path $env:RUNNER_TEMP 'D7Release'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $out 'tools') -Force|Out-Null
          Invoke-ps2exe -inputFile (Join-Path $src 'D7_Gaming_Engine.ps1') -outputFile (Join-Path $out 'D7_Gaming_Engine.exe') -x64 -STA -noConsole -requireAdmin -iconFile (Join-Path $src 'D7_Gaming_Engine.ico') -title 'D7 Gaming Engine' -product 'D7 Gaming Engine Doctor Core' -company 'D7' -copyright 'D7' -version '0.9.2.0'
          foreach($n in @('README_AR.txt','CHANGELOG_AR.txt','version.txt')){Copy-Item (Join-Path $src $n) $out -Force}
          if(Test-Path (Join-Path $src 'tools\PRESENTMON_LICENSE.txt')){Copy-Item (Join-Path $src 'tools\PRESENTMON_LICENSE.txt') (Join-Path $out 'tools\PRESENTMON_LICENSE.txt') -Force}
          $exe=Join-Path $out 'D7_Gaming_Engine.exe';if(-not(Test-Path $exe)){throw 'Build failed'};if((Get-Item $exe).Length-lt 70000){throw 'EXE too small'}
          Write-Host ('EXE bytes '+(Get-Item $exe).Length)
          "D7_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package and publish stable v0.9.2
        shell: powershell
        run: |
          $repo=$env:GITHUB_WORKSPACE;$src=$env:D7_SRC;$out=$env:D7_OUT;$stable=Join-Path $repo 'd7-gaming-engine\stable'
          $zip=Join-Path $stable 'D7_Gaming_Engine_v0.9.2.zip';Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$notes=(Get-Content (Join-Path $src 'CHANGELOG_AR.txt') -Raw -Encoding UTF8).Trim()
          $m=[ordered]@{product='D7 Gaming Engine';channel='stable';version='0.9.2';minimumWindowsBuild=19045;packageUrl='https://raw.githubusercontent.com/Emperor0/em/main/d7-gaming-engine/stable/D7_Gaming_Engine_v0.9.2.zip';sha256=$hash;changelogAr=$notes;publishedUtc=(Get-Date).ToUniversalTime().ToString('o')}
          [IO.File]::WriteAllText((Join-Path $stable 'latest.json'),($m|ConvertTo-Json -Depth 5),(New-Object Text.UTF8Encoding($false)))
          Write-Host ('Stable SHA256 '+$hash)
          git config user.name 'D7 Release Bot';git config user.email 'd7-release-bot@users.noreply.github.com'
          git add d7-gaming-engine/stable/D7_Gaming_Engine_v0.9.2.zip d7-gaming-engine/stable/latest.json
          if(-not(git diff --cached --quiet)){git commit -m 'Publish D7 Gaming Engine v0.9.2 Doctor Core';git pull --rebase origin main;git push}

      - name: Upload D7 v0.9.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: D7-Gaming-Engine-v0.9.2-Windows
          path: d7-gaming-engine/stable/D7_Gaming_Engine_v0.9.2.zip
          if-no-files-found: error
          retention-days: 30
