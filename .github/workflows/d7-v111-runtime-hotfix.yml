name: D7 v1.1.1 Runtime Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d7-v111-runtime-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d7-v111-runtime-hotfix
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare and validate patched source
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\v110'
          $src = Join-Path $env:RUNNER_TEMP 'D7v111Source'
          Remove-Item $src -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $src -Force | Out-Null

          $sourcePath = Join-Path $root 'D7_Gaming_Engine.ps1'
          $text = [IO.File]::ReadAllText($sourcePath, [Text.Encoding]::UTF8)

          # Runtime lexer hotfix: PowerShell accepts these during parsing but treats them
          # as command names at runtime (e.g. return$false -> command "return$false").
          $text = $text.Replace('return$','return $')
          $text = $text.Replace('return[','return [')
          $text = $text.Replace('return(','return (')
          $text = $text.Replace("throw'","throw '")
          $text = $text.Replace('throw"','throw "')
          $text = $text.Replace("$Version='1.1.0'","$Version='1.1.1'")

          $patched = Join-Path $src 'D7_Gaming_Engine.ps1'
          [IO.File]::WriteAllText($patched,$text,(New-Object Text.UTF8Encoding($true)))
          Copy-Item (Join-Path $root 'README_AR.txt') $src -Force
          [IO.File]::WriteAllText((Join-Path $src 'CHANGELOG_AR.txt'), @'
          D7 Gaming Engine v1.1.1 — Runtime Hotfix

          - إصلاح خطأ PowerShell: The term 'return$false' is not recognized.
          - إصلاح جميع return$ / return[ / return( المشابهة قبل البناء، وليس الموضع الظاهر فقط.
          - إضافة فحص static يمنع رجوع نفس فئة الخطأ مستقبلًا.
          - المحافظة على Gaming + Streaming profile الخفيف والقابل للاسترجاع.
          - المحافظة على Online Only + SHA-256 updater.
          '@, (New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $src 'version.txt'),'1.1.1',(New-Object Text.UTF8Encoding($false)))

          if($text -match 'return(?=[$\[(])'){ throw 'Unsafe compact return token still present.' }
          if($text -match 'throw(?=["''])'){ throw 'Unsafe compact throw token still present.' }

          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($patched,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){
            $errors|ForEach-Object{Write-Host ('PARSER: '+$_.Message+' line '+$_.Extent.StartLineNumber)}
            throw ('Parser errors: '+$errors.Count)
          }

          # Extra runtime-oriented lint for accidental keyword/operand concatenation.
          $bad = Select-String -Path $patched -Pattern 'return[$\[(]|throw["'']' -AllMatches
          if($bad){$bad|ForEach-Object{Write-Host $_.Line};throw 'Runtime keyword lint failed.'}

          $oldPkg = Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable\D7_Gaming_Engine_v1.1.0.zip'
          if(-not(Test-Path $oldPkg)){throw 'D7 v1.1.0 package missing.'}
          $old=Join-Path $env:RUNNER_TEMP 'D7Old';Remove-Item $old -Recurse -Force -ErrorAction SilentlyContinue;Expand-Archive $oldPkg $old -Force
          $oldExe=Get-ChildItem $old -Recurse -File -Filter 'D7_Gaming_Engine.exe'|Select-Object -First 1
          if(-not$oldExe){throw 'Existing D7 EXE missing.'}
          Add-Type -AssemblyName System.Drawing
          $icon=[Drawing.Icon]::ExtractAssociatedIcon($oldExe.FullName)
          $stream=[IO.File]::Create((Join-Path $src 'D7_Gaming_Engine.ico'));try{$icon.Save($stream)}finally{$stream.Dispose();$icon.Dispose()}

          "D7_SRC=$src" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install PS2EXE
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force

      - name: Build D7 v1.1.1 Windows EXE
        shell: powershell
        run: |
          $src=$env:D7_SRC
          $out=Join-Path $env:RUNNER_TEMP 'D7Release'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          Invoke-ps2exe -inputFile (Join-Path $src 'D7_Gaming_Engine.ps1') -outputFile (Join-Path $out 'D7_Gaming_Engine.exe') -x64 -STA -noConsole -requireAdmin -iconFile (Join-Path $src 'D7_Gaming_Engine.ico') -title 'D7 Gaming Engine' -product 'D7 Gaming Engine Gaming + Streaming Edition' -company 'D7' -copyright 'D7' -version '1.1.1.0'
          foreach($n in @('README_AR.txt','CHANGELOG_AR.txt','version.txt')){Copy-Item (Join-Path $src $n) $out -Force}
          $exe=Join-Path $out 'D7_Gaming_Engine.exe'
          if(-not(Test-Path $exe)){throw 'Build failed.'}
          $ver=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if($ver.FileVersion -notlike '1.1.1*'){throw 'EXE version mismatch.'}
          "D7_OUT=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package v1.1.1
        shell: powershell
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'D7_Gaming_Engine_v1.1.1.zip'
          Compress-Archive -Path (Join-Path $env:D7_OUT '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "D7_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "D7_HASH=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish stable v1.1.1 online channel
        shell: powershell
        run: |
          $stable=Join-Path $env:GITHUB_WORKSPACE 'd7-gaming-engine\stable'
          Copy-Item $env:D7_ZIP (Join-Path $stable 'D7_Gaming_Engine_v1.1.1.zip') -Force
          $notes=(Get-Content (Join-Path $env:D7_SRC 'CHANGELOG_AR.txt') -Raw -Encoding UTF8).Trim()
          $m=[ordered]@{
            product='D7 Gaming Engine';channel='stable';version='1.1.1';minimumWindowsBuild=19045;updateMode='online-only';
            packageUrl='https://raw.githubusercontent.com/Emperor0/em/main/d7-gaming-engine/stable/D7_Gaming_Engine_v1.1.1.zip';sha256=$env:D7_HASH;changelogAr=$notes;publishedUtc=(Get-Date).ToUniversalTime().ToString('o')
          }
          [IO.File]::WriteAllText((Join-Path $stable 'latest.json'),($m|ConvertTo-Json -Depth 5),(New-Object Text.UTF8Encoding($false)))
          git config user.name 'D7 Release Bot'
          git config user.email 'd7-release-bot@users.noreply.github.com'
          git add d7-gaming-engine/stable/D7_Gaming_Engine_v1.1.1.zip d7-gaming-engine/stable/latest.json
          git commit -m 'Publish D7 Gaming Engine v1.1.1 runtime hotfix'
          git pull --rebase origin main
          git push

      - name: Upload D7 v1.1.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: D7-Gaming-Engine-v1.1.1-Windows
          path: ${{ env.D7_ZIP }}
          if-no-files-found: error
          retention-days: 30
